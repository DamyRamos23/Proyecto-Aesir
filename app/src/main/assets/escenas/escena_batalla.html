<!-- CU-01 Hasta el Alba: campo de batalla con los 7 enemigos de la noche. La app elige
     el enemigo con odinEnemigo(n) y anima los golpes con odinGolpe(), odinEscudo() y odinDerrota().
     El lobo de la oleada 2 reutiliza las rutas del Fenrir de ArteRagnarok.kt. -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#06070d}
:root{--tx:0;--ty:0}
svg{position:absolute;inset:0;display:block}
.capa1{transform:translate(calc(var(--tx)*3px),calc(var(--ty)*1.8px))}
.capa2{transform:translate(calc(var(--tx)*7px),calc(var(--ty)*4.2px))}
.capa3{transform:translate(calc(var(--tx)*12px),calc(var(--ty)*7.2px))}
.capa4{transform:translate(calc(var(--tx)*16px),calc(var(--ty)*9px))}
.enemigo,.cielo{display:none}
body[data-e="1"] .e1,body[data-e="2"] .e2,body[data-e="3"] .e3,body[data-e="4"] .e4,
body[data-e="5"] .e5,body[data-e="6"] .e6,body[data-e="7"] .e7,
body[data-e="1"] .c1,body[data-e="2"] .c2,body[data-e="3"] .c3,body[data-e="4"] .c4,
body[data-e="5"] .c5,body[data-e="6"] .c6,body[data-e="7"] .c7{display:inline}
@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.2deg)}}
@keyframes breath{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes breath2{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.06)}}
@keyframes eyes{0%,100%{opacity:.6}45%{opacity:1}55%{opacity:.85}}
@keyframes mist{0%,100%{transform:translateX(-18px);opacity:.6}50%{transform:translateX(18px);opacity:1}}
@keyframes nube{0%,100%{transform:translateX(-10px)}50%{transform:translateX(14px)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes rag{0%,100%{transform:skewX(-2.5deg)}50%{transform:skewX(2.5deg)}}
@keyframes dust{0%{transform:translate(0,0);opacity:0}15%{opacity:.85}100%{transform:translate(-12px,-90px);opacity:0}}
@keyframes snow{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(-40px,460px);opacity:0}}
@keyframes ember{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(18px,-180px);opacity:0}}
@keyframes flame{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.9,1.12) skewX(4deg)}50%{transform:scale(1.06,.9) skewX(-3deg)}75%{transform:scale(.95,1.08) skewX(2deg)}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes flash{0%,91%,100%{opacity:0}93%{opacity:.9}95%{opacity:.15}96.5%{opacity:.7}}
@keyframes alaI{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
@keyframes alaD{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes rays{to{transform:rotate(360deg)}}
@keyframes wisp{0%{stroke-dashoffset:120;opacity:0}30%{opacity:.6}100%{stroke-dashoffset:-120;opacity:0}}
@keyframes aurora{0%,100%{transform:translateX(-20px) scaleY(1);opacity:.7}50%{transform:translateX(20px) scaleY(1.3);opacity:1}}
@keyframes vaho{0%{transform:translate(0,0) scale(.6);opacity:0}30%{opacity:.9}100%{transform:translate(30px,10px) scale(1.5);opacity:0}}
@keyframes aliento{0%{transform:translate(0,0) scale(.6);opacity:0}30%{opacity:.8}100%{transform:translate(-40px,-8px) scale(1.4);opacity:0}}
@keyframes ojoLobo{0%,100%{opacity:.7;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
@keyframes lobo{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-3px,2px) rotate(-.8deg)}}
@keyframes baba{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.25)}}
@keyframes luciernaga{0%,100%{transform:translate(0,0);opacity:.1}40%{opacity:1}50%{transform:translate(10px,-14px)}80%{opacity:.2}}
@keyframes pcae{0%{transform:translate(0,-60px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(-50px,420px) rotate(220deg);opacity:0}}
@keyframes gota{0%{transform:translateY(0) scaleY(.4);opacity:0}20%{opacity:1}100%{transform:translateY(22px) scaleY(1.2);opacity:0}}
@keyframes erupcion{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes humo{0%,100%{transform:translateX(-14px)}50%{transform:translateX(16px)}}
@keyframes ave{0%{transform:translate(-60px,10px)}100%{transform:translate(440px,-40px)}}
@keyframes disuelve{0%{transform:translate(0,0);opacity:0}20%{opacity:.8}100%{transform:translate(14px,-120px);opacity:0}}
@keyframes hit{0%{transform:translateX(0);filter:none}10%{transform:translateX(12px);filter:brightness(2.6)}25%{transform:translateX(-8px);filter:brightness(1.6)}40%{transform:translateX(4px);filter:none}100%{transform:translateX(0)}}
@keyframes slash{0%{stroke-dashoffset:320;opacity:0}10%{opacity:1}45%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
@keyframes red{0%{opacity:0}30%{opacity:.5}100%{opacity:0}}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1;filter:none}30%{filter:brightness(2.2)}100%{transform:translateY(90px) rotate(6deg);opacity:0;filter:brightness(.4)}}
.sway{transform-box:view-box;transform-origin:195px 410px;animation:sway 6s ease-in-out infinite}
.breath{animation:breath 4.4s ease-in-out infinite}
.breath2{transform-box:fill-box;transform-origin:50% 0;animation:breath2 4.4s ease-in-out infinite}
.eyes{animation:eyes 2.8s ease-in-out infinite}
.mist{animation:mist 11s ease-in-out infinite}
.nube{animation:nube 18s ease-in-out infinite}.nube2{animation:nube 24s ease-in-out infinite reverse}
.stars circle{animation:twinkle 3.2s ease-in-out infinite}
.stars circle:nth-child(2n){animation-delay:-1.1s}
.stars circle:nth-child(3n){animation-delay:-2.2s}
.rag{transform-box:fill-box;transform-origin:50% 0;animation:rag 3.6s ease-in-out infinite}
.dust{animation:dust 5s linear infinite}
.snow{animation:snow 8s linear infinite}
.ember{animation:ember 4s linear infinite}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame .9s ease-in-out infinite}
.glow{animation:glow 3s ease-in-out infinite}
.flash{animation:flash 7s linear infinite}
.alaI{transform-box:view-box;transform-origin:182px 200px;animation:alaI 3.4s ease-in-out infinite}
.alaD{transform-box:view-box;transform-origin:208px 200px;animation:alaD 3.4s ease-in-out infinite}
.hover{animation:hover 4s ease-in-out infinite}
.rays{transform-box:view-box;transform-origin:195px 352px;animation:rays 90s linear infinite}
.wisp path{fill:none;stroke:#7fffd0;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:40 80;animation:wisp 4.5s linear infinite;opacity:0}
.wisp path:nth-child(2){animation-delay:-1.5s}.wisp path:nth-child(3){animation-delay:-3s}
.e5 .wisp path{stroke:#b48cff}
.aurora{transform-box:fill-box;transform-origin:50% 50%;animation:aurora 12s ease-in-out infinite}
.vaho ellipse{transform-box:fill-box;transform-origin:0 50%;animation:vaho 3.6s ease-out infinite}
.vaho ellipse:nth-child(2){animation-delay:-1.8s}
.aliento ellipse{transform-box:fill-box;transform-origin:100% 50%;animation:aliento 3s ease-out infinite}
.aliento ellipse:nth-child(2){animation-delay:-1.5s}
.ojoLobo{transform-box:fill-box;transform-origin:50% 50%;animation:ojoLobo 2.6s ease-in-out infinite}
.lobo{transform-box:view-box;transform-origin:300px 420px;animation:lobo 5s ease-in-out infinite}
.baba{transform-box:fill-box;transform-origin:50% 0;animation:baba 2.2s ease-in-out infinite}
.luciernaga{animation:luciernaga 6s ease-in-out infinite}
.pcae{animation:pcae 9s linear infinite}
.gota{animation:gota 1.6s ease-in infinite}
.erupcion{animation:erupcion 2.4s ease-in-out infinite}
.humo{animation:humo 16s ease-in-out infinite}
.ave{animation:ave 14s linear infinite}
.disuelve circle{animation:disuelve 5s linear infinite}
body.golpe .objetivo{animation:hit .7s ease-out}
body.golpe .tajo{animation:slash .7s ease-out forwards}
.tajo{stroke-dasharray:320;stroke-dashoffset:320;opacity:0}
body.escudo .temblor{animation:shake .5s ease-out}
body.escudo .rojo{animation:red .8s ease-out}
.rojo{opacity:0}
body.derrota .objetivo{animation:fall 1.2s ease-in forwards}
@media (prefers-reduced-motion: reduce){svg *{animation:none !important}}
